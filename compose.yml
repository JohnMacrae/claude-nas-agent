services:

  agent:
    build: ./agent
    container_name: property-agent
    restart: unless-stopped
    ports:
      - "3005:3001"
    volumes:
      - ./flags:/flags
      - ./logs:/logs
      - ./output:/output
      - ./properties.txt:/agent/properties.txt:ro
      - ./property-aliases.json:/agent/property-aliases.json:ro
      - ./rates.json:/agent/rates.json:ro
      - /volume1/docker/property_details/JJP_Property_List.md:/agent/JJP_Property_List.md:ro
      - ./agent-system-prompt.md:/agent/agent-system-prompt.md:ro
      # Mount host Claude Code credentials so OAuth MCPs (Gmail, GCal) work
      - /home/john/.claude:/home/agent/.claude:rw
      - /home/john/.claude.json:/home/agent/.claude.json:rw
      - /volume1/docker/property-agent/.claude:/agent/.claude:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OPEN_BRAIN_MCP_URL=${OPEN_BRAIN_MCP_URL}
      - OPEN_BRAIN_MCP_KEY=${OPEN_BRAIN_MCP_KEY}
      - SUPABASE_PROJECT_URL=${SUPABASE_PROJECT_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
      - FREEAGENT_CLIENT_ID=${FREEAGENT_CLIENT_ID}
      - FREEAGENT_CLIENT_SECRET=${FREEAGENT_CLIENT_SECRET}
      - FREEAGENT_REFRESH_TOKEN=${FREEAGENT_REFRESH_TOKEN}
      - FREEAGENT_CONTACT_URL=${FREEAGENT_CONTACT_URL}
      - TZ=Europe/London
      - FLAGS_DIR=/flags
      - LOGS_DIR=/logs
      - AGENT_DIR=/agent
      # Watchdog thresholds (merged from watchdog container)
      - WARN_SESSIONS_PER_HOUR=4
      - PAUSE_SESSIONS_PER_HOUR=6
      - KILL_SESSIONS_PER_HOUR=8
      - WARN_SESSION_TOKENS=40000
      - KILL_SESSION_TOKENS=60000
    networks:
      - agent-net

networks:
  agent-net:
    external: true
